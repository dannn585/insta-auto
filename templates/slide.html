<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #0A0C12;
    --grid: rgba(255,255,255,.07);
    --ink: #FFFFFF;
    --sub: rgba(255,255,255,.72);
    --accent: #FFD400;
    --blue: #FFD400;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 54px 54px;
    background-position: -1px -1px;
    position: relative;
    overflow: hidden;
  }
  body::before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:#2B4CFF;filter:blur(160px);opacity:.45;left:-350px;top:-300px}
  body::after{content:"";position:absolute;width:800px;height:800px;border-radius:50%;background:#FF3B5C;filter:blur(160px);opacity:.4;right:-350px;bottom:-300px}
  .frame{z-index:1}
  .frame {
    position: absolute; inset: 64px;
    display: flex; flex-direction: column;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 26px; font-weight: 700; letter-spacing: .08em; color: var(--sub);
  }
  .tag {
    background: #FFD400; color: #0A0C12;
    padding: 10px 22px; border-radius: 4px; letter-spacing: .12em;
  }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 26px; color: var(--sub); font-weight: 500;
  }
  .page { font-family: "DejaVu Sans Mono", monospace; font-size: 24px; }

  /* cover */
  .kicker {
    display: inline-block; align-self: flex-start;
    font-family: "DejaVu Sans Mono", monospace; font-weight: 700;
    font-size: 40px; color: var(--accent); letter-spacing: .1em;
    border-bottom: 6px solid var(--accent); padding-bottom: 8px; margin-bottom: 48px;
  }
  .title { font-feature-settings: "palt"; font-size: 104px; font-weight: 900; line-height: 1.22; letter-spacing: -.01em; }
  .title em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 56px; font-size: 38px; font-weight: 500; line-height: 1.6; color: var(--sub); }

  /* text */
  .heading {
    font-size: 72px; font-weight: 900; line-height: 1.3; margin-bottom: 64px;
    padding-left: 28px; border-left: 14px solid var(--accent);
  }
  .items { list-style: none; display: flex; flex-direction: column; gap: 40px; }
  .items li {
    display: grid; grid-template-columns: 76px 1fr; align-items: start;
    font-size: 44px; font-weight: 700; line-height: 1.55;
    background: rgba(255,255,255,.06); border: 3px solid rgba(255,255,255,.85);
    border-radius: 10px; padding: 30px 36px 30px 28px;
  }
  .num {
    font-family: "DejaVu Sans Mono", monospace; color: var(--blue);
    font-size: 44px; font-weight: 700;
  }
  .items li small { display: block; font-size: 32px; font-weight: 500; color: var(--sub); margin-top: 8px; line-height: 1.5; }

  /* cta */
  .cta .title { font-size: 92px; }
  .cta-box {
    margin-top: 72px; background: #FFD400; color: #0A0C12;
    border-radius: 12px; padding: 48px 52px; font-size: 42px; font-weight: 700; line-height: 1.6;
  }
  .cta-box span { color: #C4002B; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top"><span class="tag">{{TAG}}</span><span>{{SERIES}}</span></div>
    <div class="content {{TYPE}}">{{BODY}}</div>
    <div class="bottom"><span>@{{HANDLE}}</span><span class="page">{{PAGE}}</span></div>
  </div>
</body>
</html>
