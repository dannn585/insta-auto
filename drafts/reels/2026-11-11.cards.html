<!-- 11/11 リール「Claudeの答えが別物になる一言5つ」の上の画面（カード）。
     質問と答えは説明用の例。答えは Claude（このリールを作った Claude）が出す内容を短くしたもの。 -->

<template id="plain_q">
<div class="chat">
  <div class="me">自己分析って、どうやればいい？</div>
</div>
</template>

<template id="plain_a">
<div class="chat">
  <div class="me">自己分析って、どうやればいい？</div>
  <div class="ai dim">自己分析にはさまざまな方法があります。まず大切なのは、自分の過去の経験をていねいに振り返ることです。たとえば小学校から大学までの出来事を時系列で書き出し、そのときの気持ちや考えを思い出してみましょう。また、他己分析として友人や家族に聞いてみるのも効果的です。さらに、診断ツールを使う方法も…</div>
  <div class="note" style="right:40px;bottom:60px">長い…結局どうするの？</div>
</div>
</template>

<template id="before_after">
<div class="ba">
  <div class="box before"><div class="lab">BEFORE</div>自己分析って、どうやればいい？<br>→ 長い前置きが続いて、結局どうするか分からない</div>
  <div class="arrow">▼</div>
  <div class="box after"><div class="lab">AFTER</div>自己分析って、どうやればいい？<span class="mark">結論から3行で</span><br>→ すぐ動ける3行が返ってくる</div>
</div>
</template>

<template id="c1_q">
<div class="chat">
  <div class="me">自己分析のやり方を教えて。<b class="mark">結論から3行で。</b></div>
</div>
</template>

<template id="c1_a">
<div class="chat">
  <div class="me">自己分析のやり方を教えて。<b class="mark">結論から3行で。</b></div>
  <div class="ai">① 頑張った経験を10個書き出す<br>② それぞれ「なぜ頑張れたか」を1行で<br>③ 何度も出てくる理由が、あなたの軸</div>
</div>
</template>
