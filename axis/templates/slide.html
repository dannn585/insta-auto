<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  AXIS カルーセル v2（2026-11-05）
  サークルのCanvaテンプレ「AXIS１ 勉強会やってます」(DAG8ijGL2Fc) に合わせた見た目。
  - 背景：活動の写真を白っぽく薄めたもの（axis/assets/bg.jpg。無いときは色だけで近い雰囲気を出す）
  - 文字：中央ぞろえ・極太・黒。強調は 赤 #FF3131（<em>）と 水色 #38B6FF（<strong>）
  - 左下に「business×大学」、右下にロゴ
-->
<style>
  :root { --red:#FF3131; --blue:#38B6FF; --ink:#111111; --band:rgba(223,241,245,.9); --bubble:#9DD7E6; --purple:#4F136B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; }
  body { font-family:"Noto Sans CJK JP",sans-serif; color:var(--ink); position:relative; overflow:hidden; background:#EDE7E1; }

  /* 背景：写真 + 白いもや */
  .bg { position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(3px); }
  .bg.fallback {
    background:
      radial-gradient(420px 300px at 18% 30%, #F6F1E8 0%, transparent 70%),
      radial-gradient(520px 380px at 78% 18%, #FFFFFF 0%, transparent 70%),
      radial-gradient(360px 300px at 85% 62%, #8C9A78 0%, transparent 70%),
      radial-gradient(460px 360px at 25% 72%, #9A7B62 0%, transparent 70%),
      radial-gradient(520px 260px at 55% 92%, #C9A88A 0%, transparent 70%),
      radial-gradient(300px 260px at 52% 48%, #B79C86 0%, transparent 70%),
      linear-gradient(180deg, #F3EFEA 0%, #D9CFC6 55%, #CDBFB2 100%);
    filter:blur(30px);
  }
  .haze { position:absolute; inset:0; background:rgba(255,255,255,.62); }

  .content { position:absolute; left:80px; right:80px; top:130px; bottom:230px;
             display:flex; flex-direction:column; justify-content:center; align-items:center; gap:110px; text-align:center; }
  .block { font-feature-settings:"palt"; font-weight:900; font-size:66px; line-height:1.5; letter-spacing:.02em; }
  .block.s { font-size:54px; }
  .block.xs { font-size:38px; font-weight:700; line-height:1.6; }
  .block.left { text-align:left; }
  em { font-style:normal; color:var(--red); }
  strong { font-weight:900; color:var(--blue); }

  /* 表紙：水色の帯 + 右上の紫のタグ */
  .cover .band { position:absolute; left:0; right:0; top:420px; padding:70px 60px; background:var(--band); text-align:center; }
  .cover .band .block { font-size:74px; line-height:1.55; }
  .tag { position:absolute; right:0; top:300px; min-width:150px; height:120px; padding:0 34px; background:var(--purple); color:#fff;
         display:flex; align-items:center; justify-content:center; font-weight:900; font-size:40px; letter-spacing:.06em; }

  /* 下部 */
  .foot { position:absolute; left:0; bottom:48px; font-family:"Noto Sans CJK JP",sans-serif; font-weight:900; font-size:66px; letter-spacing:-.01em; }
  .logo { position:absolute; right:56px; bottom:44px; width:150px; height:150px; border-radius:50%; mix-blend-mode:multiply; }
  .page { position:absolute; right:60px; top:56px; font-weight:700; font-size:28px; color:rgba(17,17,17,.45); letter-spacing:.1em; }

  /* 最後：大きなロゴ + 水色の吹き出し */
  .cta .content { justify-content:flex-start; top:140px; gap:70px; }
  .cta .biglogo { position:absolute; right:30px; top:780px; width:360px; height:360px; border-radius:50%; mix-blend-mode:multiply; }
  .bubble { position:absolute; left:60px; bottom:90px; width:720px; padding:46px 40px; background:var(--bubble); border-radius:60px;
            font-weight:900; font-size:62px; line-height:1.45; text-align:center; }
  .bubble::after { content:""; position:absolute; right:80px; top:-56px; border:40px solid transparent; border-bottom:40px solid var(--bubble);
                   border-right-width:0; border-left-width:70px; border-bottom-width:60px; }
</style>
</head>
<body class="{{TYPE}}">
  <div class="bg {{BGCLASS}}" style="{{BGSTYLE}}"></div><div class="haze"></div>
  {{BODY}}
  <div class="page">{{PAGE}}</div>
  {{FOOT}}
</body>
</html>
