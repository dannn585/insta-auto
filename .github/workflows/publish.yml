name: Instagram daily post

on:
  schedule:
    # 20:00 JST ごろに投稿したいが、GitHub の予約は毎日 7〜8 時間遅れて動いていた（2026-11 実測）。
    # そこで「毎時1回」動かし、19:30〜23:59 JST に当たった最初の回だけが投稿する（POST_WINDOW）。
    # 投稿済みなら後の回は何もしない（queue から posted に移動済み＋Instagram 上の同じキャプションも確認）。
    - cron: "17 * * * *"
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      post_date:
        description: "投稿する日付フォルダ（YYYY-MM-DD）。空欄なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せず内容だけ確認"
        required: false
        default: "0"
      check_only:
        description: "1 = 鍵の確認だけ / 2 = 投稿の手前まで試す（公開しない）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 予約が遅れて待たされた回でも、最新の状態（投稿済みかどうか）を見る
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
          POST_WINDOW: ${{ github.event_name == 'schedule' && '19:30-23:59' || '' }}
        run: python scripts/publish.py
      - name: Move posted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Posted $(TZ=Asia/Tokyo date +%F)"
          # PC の自動同期などと push がぶつかることがあるので、取り込み直して数回やり直す
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
