name: Instagram daily post

on:
  schedule:
    - cron: "0 11 * * *"   # 毎日 20:00 JST（GitHubの混雑で数分〜数十分遅れることがあります）
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      post_date:
        description: "投稿する日付フォルダ（YYYY-MM-DD）。空欄なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せず内容だけ確認"
        required: false
        default: "0"
      check_only:
        description: "1 = 鍵の確認だけ / 2 = 投稿の手前まで試す（公開しない）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
        run: python scripts/publish.py
      - name: Move posted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Posted $(TZ=Asia/Tokyo date +%F)" && git push)
