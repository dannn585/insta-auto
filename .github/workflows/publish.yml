name: Instagram daily post

on:
  schedule:
    # 20:00 JST ごろに投稿。GitHub の予約は遅れる・飛ぶことがあるので、0分を避けて何回か実行する。
    # 投稿済みなら後の回は何もしない。19:30〜23:59 JST 以外に動いた回も何もしない（POST_WINDOW）。
    - cron: "43 10 * * *"   # 19:43 JST
    - cron: "13 11 * * *"   # 20:13 JST
    - cron: "43 11 * * *"   # 20:43 JST
    - cron: "23 12 * * *"   # 21:23 JST
    - cron: "23 13 * * *"   # 22:23 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      post_date:
        description: "投稿する日付フォルダ（YYYY-MM-DD）。空欄なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せず内容だけ確認"
        required: false
        default: "0"
      check_only:
        description: "1 = 鍵の確認だけ / 2 = 投稿の手前まで試す（公開しない）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
          POST_WINDOW: ${{ github.event_name == 'schedule' && '19:30-23:59' || '' }}
        run: python scripts/publish.py
      - name: Move posted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Posted $(TZ=Asia/Tokyo date +%F)" && git push)
