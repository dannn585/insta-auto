name: Fetch past posts

on:
  workflow_dispatch:
    inputs:
      account:
        description: "axis = @axis_doshisha / main = 自分のアカウント"
        required: true
        default: "axis"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch
        env:
          ACCOUNT_DIR: ${{ github.event.inputs.account == 'axis' && 'axis' || '' }}
          IG_ACCESS_TOKEN: ${{ github.event.inputs.account == 'axis' && secrets.AXIS_IG_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_posts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true
          git add -A
          git diff --cached --quiet || (git commit -m "Fetch past posts (${{ github.event.inputs.account }})" && git push)
