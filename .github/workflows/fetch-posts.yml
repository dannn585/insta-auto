name: Fetch past posts

on:
  schedule:
    # 毎晩 AXIS と panda の数字（リーチ・保存など）を自動で取り込む。23:07 JST（GitHubの予約は数時間遅れることがある）
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "main = 収益化用（@panda.7475341） / axis = @axis_doshisha（AXISの鍵） / axis_public = AXISの公開投稿をpandaの鍵で読む"
        type: choice
        options: [main, axis, axis_public]
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch
        if: (github.event.inputs.account || 'axis') != 'axis_public'
        env:
          ACCOUNT_DIR: ${{ (github.event.inputs.account || 'axis') == 'axis' && 'axis' || '' }}
          IG_ACCESS_TOKEN: ${{ (github.event.inputs.account || 'axis') == 'axis' && secrets.AXIS_IG_ACCESS_TOKEN || (github.event.inputs.account || 'axis') != 'axis' && secrets.IG_ACCESS_TOKEN || '' }}
        run: python scripts/fetch_posts.py
      - name: Fetch panda too (nightly only)
        if: always() && github.event_name == 'schedule'
        continue-on-error: true   # panda が失敗しても AXIS の分は保存する
        env:
          ACCOUNT_DIR: ""
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_posts.py
      - name: Fetch public posts via Business Discovery
        if: (github.event.inputs.account || 'axis') == 'axis_public'
        env:
          ACCOUNT_DIR: axis
          TARGET_USERNAME: axis_doshisha
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_public.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true
          git add -A
          git diff --cached --quiet || (git commit -m "Fetch past posts (${{ (github.event.inputs.account || 'axis') }})" && git push)
