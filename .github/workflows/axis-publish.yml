name: AXIS daily post

on:
  schedule:
    # 21:00 JST ごろに投稿。メインと同じく、0分を避けて何回か実行し、20:30〜23:59 JST 以外の回は何もしない。
    - cron: "53 11 * * *"   # 20:53 JST
    - cron: "33 12 * * *"   # 21:33 JST
    - cron: "33 13 * * *"   # 22:33 JST
  workflow_dispatch:
    inputs:
      post_date:
        description: "投稿する日付フォルダ（YYYY-MM-DD）。空欄なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せず内容だけ確認"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-post   # メインの投稿と git push がぶつからないよう同じグループ
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish (@axis_doshisha)
        env:
          ACCOUNT_DIR: axis
          POST_WINDOW: ${{ github.event_name == 'schedule' && '20:30-23:59' || '' }}
          IG_ACCESS_TOKEN: ${{ secrets.AXIS_IG_ACCESS_TOKEN }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/publish.py
      - name: Move posted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true
          git add -A
          git diff --cached --quiet || (git commit -m "AXIS posted $(TZ=Asia/Tokyo date +%F)" && git push)
