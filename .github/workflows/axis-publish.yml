name: AXIS daily post

on:
  schedule:
    # 21:00 JST ごろに投稿。GitHub の予約は毎日 7〜8 時間遅れることがあるので（2026-11 実測）、
    # 毎時1回動かし、20:30〜23:59 JST に当たった最初の回だけが投稿する。
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "投稿する日付フォルダ（YYYY-MM-DD）。空欄なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せず内容だけ確認"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-post   # メインの投稿と git push がぶつからないよう同じグループ
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 予約が遅れて待たされた回でも、最新の状態（投稿済みかどうか）を見る
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish (@axis_doshisha)
        env:
          ACCOUNT_DIR: axis
          POST_WINDOW: ${{ github.event_name == 'schedule' && '20:30-23:59' || '' }}
          IG_ACCESS_TOKEN: ${{ secrets.AXIS_IG_ACCESS_TOKEN }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/publish.py
      - name: Move posted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "AXIS posted $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
